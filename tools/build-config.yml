# Build configuration for tools/generate_pack.py
#
# Version-controlled so that the pack a reviewer sees can always be traced back to
# the exact settings that produced it. Per-server gameplay options live in the
# pack's own configuration/config.yml instead, which is edited in place.

craftengine:
  # Ceiling on the CraftEngine internal states this pack may declare.
  #
  # CraftEngine registers every declared state combination as a real entry in the
  # vanilla block registry, so this number is the pack's memory and startup cost,
  # and it must be at or below `block.serverside-blocks` in CraftEngine's own
  # config.yml. The summary prints used / limit / remaining so headroom is
  # visible rather than implied.
  #
  # Roughly 4.4k states are needed by the default configuration. Note that this is
  # about twice what the mod's own blocks cost, because every vanilla block we borrow
  # carrier states from is itself converted into a CraftEngine block (see the
  # carrier invariant in the build summary) and each of those costs states too.
  #
  # Turning the terracotta and concrete variants on does not fit in this ceiling at
  # all - see the slab note in DESIGN.md section 3.1 - so the build fails rather than
  # emitting a pack with missing blocks.
  max-internal-states: 5120

  # States held back from the ceiling and never handed out.
  #
  # The last few registry slots are worth keeping: CraftEngine also allocates
  # states for its own blocks, and other packs on the same server draw from the
  # same pool. Reserving a small tail means this pack cannot be the reason
  # somebody else's pack fails to load with an unhelpful "id exhausted" error.
  reserved-states: 64

# Variant toggles. These only affect what the build emits; the emitted
# configuration/config.yml documents them for the server owner.
variants:
  disable-terracotta-variants: true
  disable-concrete-variants: true

compatibility:
  # What to do when the running server cannot represent a block the project
  # defines. The block is never deleted from the project either way.
  #
  #   disable - skip it at registration and report it (what a server owner wants)
  #   fail    - refuse to start
  #
  # On Minecraft 1.21.1 exactly one block is affected, a slab: vanilla has 60 slabs
  # with six states each, so 120 slab-shaped CraftEngine blocks is a hard ceiling
  # for the whole family, and the mod wants 121 with the variants off. Later versions
  # add slab blocks and the shortfall disappears with no change here.
  unsupported-content: disable

  # Vanilla has since added some Cinch blocks under the same name: 26.3 has concrete
  # slabs and stairs. Their CMB copies are skipped as duplicates - unless ViaBackwards
  # is installed, because older clients joining through it don't have the vanilla
  # ones. (The Java plugin will detect ViaBackwards itself.)
  viabackwards: false


features:
  # Vertical slabs: a slab stood on edge, placed against a wall or on the floor. They
  # are CraftEngine furniture (a display entity plus a shulker collider), so they use
  # no carrier state and never compete with blocks for the scarce ones.
  #
  #   cmb      - one per CMB slab or stair material that is served, crafted from
  #              three of that material's full block.
  #   vanilla  - one per vanilla slab (oak, stone brick, cut copper, wool, ...), drawn
  #              with the client's own textures and crafted like the vanilla slab.
  #   disabled - material names without the `_vertical` suffix, e.g. `oak`,
  #              `andesite_brick`. A name neither source offers stops the build.
  #
  # Each vertical slab is an entity in the world, so a build full of them costs more
  # than the same build in blocks.
  vertical-slabs:
    cmb: true
    vanilla: true
    disabled: []
    # What two slabs of one material in one cell become - vertical slabs, and the
    # furniture-fallback slabs below:
    #   block     - a real block (mining time, cracks, pistons). Jade on a vanilla
    #               client names the vanilla block it is drawn on (a mushroom stem).
    #   furniture - Jade names it after the slab; breaks in one hit like the slab.
    doubles: block

  # Horizontal stairs: a stair laid on its side - an L, three quarters of the cell,
  # full height - the corner piece for vertical slab walls. Furniture as well, with
  # the same sources: one per CMB material that is served, one per vanilla slab.
  # Six full blocks in an upside-down stair pattern make four. Independent of
  # vertical-slabs, and `disabled` takes the same material names.
  horizontal-stairs:
    cmb: true
    vanilla: true
    disabled: []

  # Furniture fallback: every CMB stair, slab, wall, fence and pane is served as
  # CraftEngine furniture - none of them can get a safe real-block carrier. Stairs keep vanilla's facing, half and corner shapes against each other,
  # slabs double into their full block, walls and fences connect like vanilla's, and
  # all of them waterlog with a bucket. Being furniture, they take several hits to
  # break (by hardness and tool) with no crack animation, and pistons and WorldEdit
  # don't move them. The vertical slabs and horizontal stairs of these
  # materials (cmb: true above) come with them.
  #
  # true, false (no stairs, slabs, walls, fences or panes at all), or a list of names
  # to serve only those (e.g. [calcite_slab]).
  furniture-fallback: true


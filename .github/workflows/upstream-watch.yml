# Watches the upstream mod (cinchtail/Cinchs_Missing_Blocks) for a new version and opens
# an issue when there is one. The bundled pack in pack/ is generated from one pinned
# upstream commit (pack/upstream.properties); following a new upstream version means
# regenerating it, which happens off GitHub, so this only raises the flag.
#
# Upstream doesn't tag releases; a release is a change of `version=` in its
# gradle.properties on the default branch.
name: upstream-watch

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare the pin with upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prop() { grep -m1 "^$1=" pack/upstream.properties | cut -d= -f2-; }
          repo=$(prop repo)
          branch=$(prop branch)
          pinned=$(prop version)
          latest=$(curl -fsSL "https://raw.githubusercontent.com/$repo/$branch/gradle.properties" \
                   | grep -m1 '^version=' | cut -d= -f2- | tr -d '[:space:]')
          echo "pinned $pinned, upstream $latest"
          if [ -z "$latest" ] || [ "$latest" = "$pinned" ]; then
            exit 0
          fi
          title="upstream: Cinch's Missing Blocks $latest"
          if gh issue list --state all --search "\"$title\" in:title" --json number --jq '.[].number' | grep -q .; then
            echo "already reported"
            exit 0
          fi
          gh issue create --title "$title" --body "Upstream ($repo, branch \`$branch\`) is at **$latest**; the bundled pack is generated from **$pinned**. Regenerate pack/ from the new version and check what changed before releasing."

# Watches the upstream mod (cinchtail/Cinchs_Missing_Blocks) for a new version and opens
# a PR that moves the pin in upstream/upstream.properties and refreshes the local
# fallback copy. Merging that PR is when the port adapts to upstream - nothing changes
# until then, and builds keep using the pinned commit (from GitHub, or the fallback
# when GitHub is down).
#
# Upstream doesn't tag releases; a release is a change of `version=` in its
# gradle.properties (see tools/upstream.py).
name: upstream-watch

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install pyyaml pillow

      - name: Compare the pin with upstream
        id: check
        run: |
          set +e
          out=$(python3 tools/upstream.py check)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 10 ]; then
            echo "newer=true" >> "$GITHUB_OUTPUT"
            echo "version=$(echo "$out" | python3 -c 'import json,sys;print(json.load(sys.stdin)["latest"]["version"])')" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Move the pin and refresh the fallback
        if: steps.check.outputs.newer == 'true'
        run: python3 tools/upstream.py bump

      - name: Try a build from the new pin
        if: steps.check.outputs.newer == 'true'
        id: build
        continue-on-error: true
        run: |
          python3 tools/upstream.py fetch --out build/upstream
          python3 tools/generate_pack.py --mod build/upstream --out build/pack --mc-version 26.3 --check 2>&1 | tee build/generate.log
          tail -n 60 build/generate.log > build/generate.tail

      - name: Open the PR
        if: steps.check.outputs.newer == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: upstream/bump
          title: "upstream: Cinch's Missing Blocks ${{ steps.check.outputs.version }}"
          commit-message: "upstream: pin Cinch's Missing Blocks ${{ steps.check.outputs.version }}"
          body: |
            Upstream released **${{ steps.check.outputs.version }}**. This moves the pin
            and refreshes the fallback copy in `upstream/`.

            Generator build from the new pin: **${{ steps.build.outcome }}**. Before
            merging, run the fixtures locally (`python3 tools/test_*.py`) and adapt the
            generator to whatever upstream changed.
          add-paths: |
            upstream/

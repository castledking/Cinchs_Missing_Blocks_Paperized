name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'

      # The wrapper, not a system Gradle: this job is also the check that it works.
      # The pack is committed in pack/, so the build needs nothing but Java.
      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: cmb-jar
          path: |
            build/libs/cmb-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

  # The jar is Java 21 bytecode compiled against paper-api 1.21.11, and claims Paper 1.21.1
  # through 26.3. Compiling proves the API calls exist at both ends (verifyFloorApi and
  # verifyNewestApi, in `check`); booting proves the jar loads, enables, installs its pack and
  # reloads on each. Each Paper version runs on the Java it requires: 21 for 1.21.x, and 25
  # for 26.x, which needs it.
  boot:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - paper: '1.21.1'
            java: '21'
          - paper: '1.21.11'
            java: '21'
          - paper: '26.3'
            java: '25'
    name: boot on Paper ${{ matrix.paper }} (Java ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}

      - name: Download the jar
        uses: actions/download-artifact@v4
        with:
          name: cmb-jar
          path: jar

      - name: Boot, reload, stop
        run: ci/boot-test.sh "${{ matrix.paper }}" "$(ls jar/cmb-*.jar | grep -v sources | head -1)"

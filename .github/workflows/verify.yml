name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'

      # The wrapper, not a system Gradle: this job is also the check that it works.
      # The pack is committed in pack/, so the build needs nothing but Java.
      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: cmb-${{ github.ref_name }}
          path: |
            build/libs/cmb-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
